[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts = --cov=app --cov-report=term-missing
filterwarnings =
    # Ignoruje warning o httpx wyłącznie z modułów starlette i fastapi
    ignore:.*Using `httpx` with `starlette\.testclient` is deprecated.*:DeprecationWarning:starlette.*
    ignore:.*Using `httpx` with `starlette\.testclient` is deprecated.*:DeprecationWarning:fastapi.*
    ignore:.*Using `httpx` with `starlette\.testclient` is deprecated.*:Warning
    # Ignoruje warning o _UnionGenericAlias wyłącznie z google.genai
    ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\.genai.*