name: "🐛 Bug Report"
description: Report an error or unexpected behavior in the application.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of what the bug is.
      placeholder: When clicking the 'Generate Synthesis' button...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Search for '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The system should stream the generated markdown report.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment & Browser
      description: OS, browser version, or relevant runtime setup.
      placeholder: Chrome 128 / macOS Sonoma / Windows 11
    validations:
      required: false