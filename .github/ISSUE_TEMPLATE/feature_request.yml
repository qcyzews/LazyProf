name: "💡 Feature Request"
description: Suggest a new feature or improvement for LazyProf AI.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Describe the feature you would like to see and the problem it solves.
      placeholder: I would like an option to export reports directly to PDF/BibTeX...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "UI / User Experience"
        - "Synthesis & RAG Pipeline"
        - "Export Formats"
        - "Translation & Languages"
        - "Other"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request here.
    validations:
      required: false