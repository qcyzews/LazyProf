# /.github/workflows/deploy_hf.yml
name: CI/CD - Test and Deploy Backend to Hugging Face Spaces

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run pytest
        working-directory: ./backend
        run: |
          pytest

  deploy:
    needs: test  # Wdrożenie nastąpi TYLKO po przejściu testów!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Backend to HF Space
        uses: huggingface/huggingface-spaces-action@v1
        with:
          space-id: ARMlabs/LazyProfBackend
          directory: backend