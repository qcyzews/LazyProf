# /.github/workflows/deploy_hf.yml
name: CI/CD - Test and Deploy Backend to Hugging Face Spaces

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run pytest
        working-directory: ./backend
        env:
          GOOGLE_API_KEY: "fake_test_key_for_ci_cd"
          QUOTA_BACKEND: "in_memory"
          MAX_CONCURRENT_PDF_PARSES: "2"
        run: |
          pytest

  deploy:
    needs: test  # Wdrożenie nastąpi TYLKO po przejściu testów!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      
      - name: Upload backend to HF Space
        env:
          HF_OIDC_RESOURCE: spaces/ARMlabs/LazyProfBackend
        run: |
          hf upload spaces/ARMlabs/LazyProfBackend ./backend . --commit-message "Deploy backend from GitHub Commit ${GITHUB_SHA::7}"
