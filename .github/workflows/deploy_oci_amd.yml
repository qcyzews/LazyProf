name: CI/CD - Test and Deploy Backend to OCI (Self-Hosted)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest # Testy wykonują się w chmurze GitHub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run pytest
        working-directory: ./backend
        env:
          GOOGLE_API_KEY: "fake_test_key_for_ci_cd"
          QUOTA_BACKEND: "in_memory"
          MAX_CONCURRENT_PDF_PARSES: "2"
        run: |
          pytest

  deploy:
    needs: test  # Wdrożenie nastąpi TYLKO po przejściu testów!
    runs-on: self-hosted  # Serwer OCI AMD
    steps:
      # POBIERANIE TYLKO BACKENDU I WORKFLOWS (sparse-checkout)
      - name: Checkout backend only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend
            .github

      - name: Build Docker Image
        run: |
          docker build -t lazyprof-backend ./backend

      # TWORZENIE PLIKU .ENV Z SEKRETU GITHUBA I URUCHOMIENIE KONTENERA
      - name: Deploy Docker Container with Envs
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          # 1. Zapisz treść sekretu do pliku .env w katalogu roboczym
          echo "$ENV_FILE_CONTENT" > .env

          # 2. Zatrzymaj i usuń stary kontener, jeśli istnieje
          docker stop lazyprof-backend || true
          docker rm lazyprof-backend || true

          # 3. Uruchom nowy kontener wskazując utworzony plik .env
          docker run -d \
            --name lazyprof-backend \
            --restart always \
            --env-file .env \
            -p 8000:8000 \
            lazyprof-backend

          # 4. (Opcjonalnie) Usuń plik .env z dysku runnera dla bezpieczeństwa
          rm -f .env