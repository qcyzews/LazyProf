# /github/workflows/deploy_oci_amd.yml
name: CI/CD - Test and Deploy Backend to OCI (Self-Hosted)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest # Testy wykonują się w chmurze GitHub (szybko i za darmo)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run pytest
        working-directory: ./backend
        env:
          GOOGLE_API_KEY: "fake_test_key_for_ci_cd"
          QUOTA_BACKEND: "in_memory"
          MAX_CONCURRENT_PDF_PARSES: "2"
        run: |
          pytest

  deploy:
    needs: test  # Wdrożenie nastąpi TYLKO po przejściu testów!
    runs-on: self-hosted  # Tutaj przekazujemy zadanie do Twojego serwera AMD!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          # Budujemy obraz bezpośrednio z katalogu /backend (lub podmień ścieżkę do Dockerfile)
          docker build -t lazyprof-backend ./backend

      - name: Run Docker Container
        run: |
          # Zatrzymaj i usuń stary kontener, jeśli istnieje
          docker stop lazyprof-backend || true
          docker rm lazyprof-backend || true

          # Uruchom nowy kontener z przekazanymi zmiennymi środowiskowymi
          docker run -d \
            --name lazyprof-backend \
            --restart always \
            -p 8000:8000 \
            lazyprof-backend